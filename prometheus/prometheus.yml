global:
  scrape_interval: 15s
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  # worker 可以 --scale：用 Docker 内置 DNS 解析服务名，拿到所有副本的 IP，逐个抓 :9100
  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 30s
  - job_name: vod-api
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["vod-api:8001"]}]
  # rabbitmq_prometheus 插件；per-object 端点按队列给出 transcode / transcode.retry / transcode.dlq 的深度
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs: [{targets: ["rabbitmq:15692"]}]
