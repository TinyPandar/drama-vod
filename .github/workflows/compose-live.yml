# 整套 Docker Compose 栈上的验收脚本（ci.yml 只跑不需要 Compose 的测试）。
# 触发：push 到 main 和 plan/**、fix/** 分支，向 main 提 PR，手动；每天定时跑一次并加跑故障注入。
# 密钥都是本次运行临时生成的随机值，只写进 runner 上的 .env，不用 GitHub secrets，不发布、不部署。
name: Compose live

on:
  push:
    branches: [main, "plan/**", "fix/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      fault:
        description: "同时跑 scripts/fault_inject.py（约 15 分钟）"
        type: boolean
        default: false

concurrency:
  group: compose-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      COMPOSE_PROJECT_NAME: drama-vod-live
      COMPOSE_FILE: docker-compose.yml:docker-compose.platform-live.yml:docker-compose.media-live.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装 ffmpeg 与脚本依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          python -m pip install pymysql boto3 websocket-client playwright
          python -m playwright install --with-deps chromium
      - name: 生成一次性 .env
        run: |
          r() { openssl rand -hex 32; }
          {
            echo "MYSQL_ROOT_PASSWORD=$(r)"; echo "MYSQL_PASSWORD=$(r)"
            echo "MINIO_ROOT_USER=vodminio"; echo "MINIO_ROOT_PASSWORD=$(r)"
            echo "PUBLIC_UPLOAD_ENDPOINT=http://localhost:9000"
            echo "HLS_SECRET=$(r)"; echo "TOKEN_SECRET=$(r)"; echo "ORIGIN_SECRET=$(r)"
            echo "VOD_PLAY_TOKEN_SECRET=$(r)"; echo "VOD_ADMIN_JWT_SECRET=$(r)"
            echo "VOD_ADMIN_USERNAME=ops"; echo "VOD_ADMIN_PASSWORD=$(r)"
          } > .env
      - name: 起栈
        run: |
          docker compose up -d --build --wait --wait-timeout 300 mysql redis rabbitmq
          docker compose up -d --build
          for i in $(seq 90); do curl -fs localhost:8080/api/v1/healthz && break; sleep 2; done
          curl -fs localhost:8080/api/v1/healthz
      - name: 验收脚本
        run: |
          set +e -uo pipefail
          set -a; . ./.env; set +a
          status=0
          run() {
            name=$1; shift
            echo "::group::$name"
            out=$("$@" 2>&1); rc=$?
            echo "$out"
            echo "::endgroup::"
            last=$(grep -E '结果|passed' <<<"$out" | tail -1)
            echo "- \`$name\` exit=$rc ${last}" >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" -eq 0 ] || { echo "::error::$name exit $rc"; status=1; }
          }
          inside() {  # 早期脚本假设在 Compose 网络里（BASE=http://nginx:8080），用 host 网络的一次性 worker 容器跑
            docker run --rm --network host --add-host nginx:127.0.0.1 --add-host mysql:127.0.0.1 \
              -e MYSQL_HOST=mysql -e MYSQL_USER=vod -e MYSQL_PASSWORD="$MYSQL_PASSWORD" -e MYSQL_DB=vod \
              -v "$PWD/scripts:/scripts:ro" drama-vod-live-worker python "/scripts/$1"
          }
          run e2e.py python scripts/e2e.py
          run playback_live.py python scripts/playback_live.py
          run platform_live.py python scripts/platform_live.py
          run media_live.py python scripts/media_live.py
          run core_live.py inside core_live.py
          run drama_vod_live.py inside drama_vod_live.py
          run browser_check.py python scripts/browser_check.py
          run console_live.py python scripts/console_live.py
          MYSQL_HOST=127.0.0.1 MYSQL_USER=root MYSQL_PASSWORD="$MYSQL_ROOT_PASSWORD" run test_fencing_mysql.py python scripts/test_fencing_mysql.py
          exit $status
      - name: 故障注入
        if: github.event_name == 'schedule' || inputs.fault
        run: python scripts/fault_inject.py
      - name: 失败时收集日志
        if: failure()
        run: docker compose logs --no-color --tail 400 > compose-logs.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore
