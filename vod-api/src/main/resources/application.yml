server:
  port: 8001
spring:
  application:
    name: vod-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DB:vod}
    username: ${MYSQL_USER:vod}
    password: ${MYSQL_PASSWORD:}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
vod:
  # dev 以外（如 prod）启动时校验密钥：为空、等于 dev 或短于 security.min-secret-length 就拒绝启动；dev 只警告。
  env: ${VOD_ENV:dev}
  hls-secret: ${HLS_SECRET:dev}
  # Core 播放 token 的 HMAC 密钥，和旧 Demo 的 TOKEN_SECRET 分开；dev 下为空时退回 dev。用 openssl rand -hex 32 生成。
  play-token-secret: ${VOD_PLAY_TOKEN_SECRET:}
  play-ttl-seconds: ${PLAY_URL_TTL:600}
  dev-api-key: ${VOD_DEV_API_KEY:}
  amqp-url: ${AMQP_URL:}
  # 以下都是可调配置项，默认值只是开发默认，不代表性能基准或容量承诺。
  security:
    min-secret-length: ${VOD_MIN_SECRET_LENGTH:32}
  playback:
    # POST /assets/{id}/playback-token 的 token 与签名地址有效期；body.ttl_seconds 超过上限时截到上限。
    # 上限应小于 Worker 的 WORKER_OUTPUT_GC_GRACE_SECONDS。
    token-ttl-seconds: ${VOD_PLAY_TOKEN_TTL_SECONDS:600}
    token-ttl-max-seconds: ${VOD_PLAY_TOKEN_TTL_MAX_SECONDS:3600}
  qoe:
    # token 过期后 QoE 上报仍接受的秒数（播放时长常超过 token 有效期）。
    token-grace-seconds: ${VOD_QOE_TOKEN_GRACE_SECONDS:3600}
    max-body-bytes: ${VOD_QOE_MAX_BODY_BYTES:16384}
    max-events: ${VOD_QOE_MAX_EVENTS:50}
    # vod_qoe_playback_errors_total{code} 的白名单，其余归 other。
    error-codes: ${VOD_QOE_ERROR_CODES:manifestLoadError,manifestLoadTimeOut,manifestParsingError,levelLoadError,levelLoadTimeOut,fragLoadError,fragLoadTimeOut,fragParsingError,fragDecryptError,keyLoadError,keyLoadTimeOut,bufferAppendError,bufferStalledError,mediaError,networkError,native}
  upload:
    # 上传会话与预签名 PUT 的有效期（秒）；过期的会话不能 complete。
    session-ttl-seconds: ${VOD_UPLOAD_SESSION_TTL_SECONDS:900}
    # 单个源对象字节上限，complete 时按 HEAD 结果判断；0 表示不限制。
    max-object-bytes: ${VOD_UPLOAD_MAX_OBJECT_BYTES:5368709120}
    allowed-extensions: ${VOD_UPLOAD_ALLOWED_EXTENSIONS:mp4,mov,m4v,mkv,webm}
    # application/octet-stream 兼容不声明类型的客户端；binary/octet-stream 是 AWS S3 对未声明类型对象可能返回的值。
    # 要严格校验可从列表去掉。
    allowed-content-types: ${VOD_UPLOAD_ALLOWED_CONTENT_TYPES:video/mp4,video/quicktime,video/x-m4v,video/x-matroska,video/webm,application/octet-stream,binary/octet-stream}
    # ---- Phase 6：Multipart（默认值只是开发默认，不是基准或承诺）----
    # 分片大小（字节）。S3 要求除最后一块外每块不小于 5 MiB，低于 5 MiB 拒绝启动；max-object-bytes / 分片大小不能超过 10000 块。
    part-size-bytes: ${VOD_UPLOAD_PART_SIZE_BYTES:8388608}
    # 控制台按文件大小选 multipart 的阈值（字节），由 GET /api/v1/uploads/config 下发；0 表示等于 part-size-bytes。
    multipart-threshold-bytes: ${VOD_UPLOAD_MULTIPART_THRESHOLD_BYTES:0}
    # multipart 会话有效期（秒），从 open 起算，不续期；这就是分片会话的上限。不得超过 604800（7 天）。
    multipart-session-ttl-seconds: ${VOD_UPLOAD_MULTIPART_SESSION_TTL_SECONDS:86400}
    # 单个分片预签名 URL 的有效期（秒），同时不超过会话剩余时间；过期后在会话内重新 POST /parts 即可。
    part-url-ttl-seconds: ${VOD_UPLOAD_PART_URL_TTL_SECONDS:900}
    # 一次 POST /parts 最多签多少个 part。
    max-parts-per-request: ${VOD_UPLOAD_MAX_PARTS_PER_REQUEST:100}
    # 过期 multipart 会话清理：轮询间隔、每轮条数、领取时长（失败后过了领取时长再试）。
    cleanup-interval-ms: ${VOD_UPLOAD_CLEANUP_INTERVAL_MS:60000}
    cleanup-initial-delay-ms: ${VOD_UPLOAD_CLEANUP_INITIAL_DELAY_MS:30000}
    cleanup-batch-size: ${VOD_UPLOAD_CLEANUP_BATCH_SIZE:50}
    cleanup-claim-seconds: ${VOD_UPLOAD_CLEANUP_CLAIM_SECONDS:300}
  quota:
    # vod_tenant.storage_quota_bytes 为 NULL 时使用；0 表示不限制（当前默认不限制）。
    default-storage-bytes: ${VOD_QUOTA_DEFAULT_STORAGE_BYTES:0}
    # Phase 5：vod_tenant.max_concurrent_jobs / max_daily_transcodes 为 NULL 时使用；0 表示不限制。超额 429 + code=quota_exceeded。
    default-max-concurrent-jobs: ${VOD_QUOTA_DEFAULT_MAX_CONCURRENT_JOBS:0}
    default-max-daily-transcodes: ${VOD_QUOTA_DEFAULT_MAX_DAILY_TRANSCODES:0}
  # ---- Phase 5 平台化控制台（默认值都只是开发默认，不是基准或承诺）----
  admin:
    # 管理端 JWT 的 HMAC 密钥；非 dev 下为空、等于 dev 或过短拒绝启动（SecretGuard），dev 下为空退回 dev。
    jwt-secret: ${VOD_ADMIN_JWT_SECRET:}
    jwt-ttl-seconds: ${VOD_ADMIN_JWT_TTL_SECONDS:3600}
    jwt-leeway-seconds: ${VOD_ADMIN_JWT_LEEWAY_SECONDS:30}
    # 只在两个都设置、且该用户名还不存在时建管理用户；仓库里没有默认口令。
    seed-username: ${VOD_ADMIN_USERNAME:}
    seed-password: ${VOD_ADMIN_PASSWORD:}
    # 新建/轮换 API Key 的最长有效期（秒）；0 表示允许不过期。
    max-key-ttl-seconds: ${VOD_ADMIN_MAX_KEY_TTL_SECONDS:0}
  ratelimit:
    enabled: ${VOD_RATELIMIT_ENABLED:true}
    # 配了就用 Redis 计数（多实例共享）；为空用进程内存桶，只对单实例有效。
    redis-url: ${VOD_RATELIMIT_REDIS_URL:${REDIS_URL:}}
    redis-timeout-ms: ${VOD_RATELIMIT_REDIS_TIMEOUT_MS:200}
    # 登录按客户端 IP 限流时读这个头（Nginx 写 X-Real-IP）；vod-api 直接对外时设成空串。
    client-ip-header: ${VOD_RATELIMIT_CLIENT_IP_HEADER:X-Real-IP}
    tenant:
      rate-per-second: ${VOD_RATELIMIT_TENANT_RPS:50}
      burst: ${VOD_RATELIMIT_TENANT_BURST:200}
    login:
      rate-per-second: ${VOD_RATELIMIT_LOGIN_RPS:0.2}
      burst: ${VOD_RATELIMIT_LOGIN_BURST:10}
    webhook:
      rate-per-second: ${VOD_RATELIMIT_WEBHOOK_RPS:5}
      burst: ${VOD_RATELIMIT_WEBHOOK_BURST:20}
  usage:
    max-history-days: ${VOD_USAGE_MAX_HISTORY_DAYS:90}
  idempotency:
    ttl-seconds: ${VOD_IDEMPOTENCY_TTL_SECONDS:86400}
  jobs:
    # POST /jobs/{id}/retry 是否也接受 CANCELLED 的任务（FAILED 总是可以）。
    retry-allow-cancelled: ${VOD_JOBS_RETRY_ALLOW_CANCELLED:true}
  template:
    default-name: ladder_v1
    # 系统模板（tenant_id=0）默认只读，避免改掉老资产的行为。
    allow-system-edit: ${VOD_TEMPLATE_ALLOW_SYSTEM_EDIT:false}
  webhook:
    dispatch-interval-ms: ${VOD_WEBHOOK_DISPATCH_INTERVAL_MS:2000}
    batch-size: ${VOD_WEBHOOK_BATCH_SIZE:20}
    max-attempts: ${VOD_WEBHOOK_MAX_ATTEMPTS:8}
    base-backoff-seconds: ${VOD_WEBHOOK_BASE_BACKOFF_SECONDS:10}
    max-backoff-seconds: ${VOD_WEBHOOK_MAX_BACKOFF_SECONDS:3600}
    backoff-jitter: ${VOD_WEBHOOK_BACKOFF_JITTER:0.5}
    claim-seconds: ${VOD_WEBHOOK_CLAIM_SECONDS:120}
    connect-timeout-ms: ${VOD_WEBHOOK_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${VOD_WEBHOOK_READ_TIMEOUT_MS:5000}
    max-response-bytes: ${VOD_WEBHOOK_MAX_RESPONSE_BYTES:4096}
    # 开发开关，默认关；只在 VOD_ENV=dev 生效，非 dev 下设置会拒绝启动。
    dev-allow-http: ${VOD_WEBHOOK_DEV_ALLOW_HTTP:false}
    dev-allow-private-hosts: ${VOD_WEBHOOK_DEV_ALLOW_PRIVATE_HOSTS:}
  outbox:
    # 兜底发布轮询（complete 后仍先走快速发布）。多实例靠条件 UPDATE 领取，领取过期后别的实例接手。
    publish-interval-ms: ${VOD_OUTBOX_PUBLISH_INTERVAL_MS:5000}
    batch-size: ${VOD_OUTBOX_BATCH_SIZE:20}
    max-backoff-seconds: ${VOD_OUTBOX_MAX_BACKOFF_SECONDS:300}
    claim-seconds: ${VOD_OUTBOX_CLAIM_SECONDS:60}
  metrics:
    # 任务积压 / outbox gauge 从库里刷新的间隔。
    refresh-interval-ms: ${VOD_METRICS_REFRESH_INTERVAL_MS:15000}
  api:
    page-size-default: ${VOD_API_PAGE_SIZE_DEFAULT:20}
    page-size-max: ${VOD_API_PAGE_SIZE_MAX:100}
  s3:
    endpoint: ${S3_ENDPOINT:}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
