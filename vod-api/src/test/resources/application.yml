spring:
  datasource:
    url: jdbc:h2:mem:vod;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
  task:
    scheduling:
      enabled: false
vod:
  outbox:
    # Keep the scheduled loop out of the way; tests call publishPending() directly.
    publish-interval-ms: 3600000
    publish-initial-delay-ms: 3600000
    batch-size: 20
    max-backoff-seconds: 300
    claim-seconds: 60
  metrics:
    # 测试里手动调用 refresh()。
    refresh-interval-ms: 3600000
    refresh-initial-delay-ms: 3600000
  upload:
    session-ttl-seconds: 900
    # 测试用小上限，MemoryStorage 默认对象 128 字节。
    max-object-bytes: 1048576
  quota:
    default-storage-bytes: 0
  webhook:
    # 测试里手动调用 WebhookDispatcher.runOnce()。
    dispatch-interval-ms: 3600000
    dispatch-initial-delay-ms: 3600000
  ratelimit:
    # 测试默认不用 Redis，额度放宽到不影响普通用例；限流用例自己起上下文改小。
    redis-url: ""
    tenant:
      rate-per-second: 1000
      burst: 100000
    login:
      rate-per-second: 1000
      burst: 100000
  api:
    page-size-default: 20
    page-size-max: 50
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
